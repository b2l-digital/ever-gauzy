# B2L: compila as imagens do Gauzy (API, web, worker) a partir de uma tag/commit fixo
# e publica no GHCR do fork com a tag de versão informada. Nunca roda na VPS.
# Vai em .github/workflows/b2l-build-images.yml no branch b2l do fork.
name: B2L Build Images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit (SHA completo) ou branch do fork a compilar'
        required: true
        default: 'fab73400e33e1c695a8ba84302a334006e238e69'
      version:
        description: 'Tag da imagem no GHCR (ex.: v111.269.3)'
        required: true
        default: 'v111.269.3'

concurrency:
  group: b2l-build-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Não publica o registro do build (contém build-args em texto puro).
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        app: [api, webapp, worker]
    steps:
      - name: Checkout do ref pedido
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Nome da imagem
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/gauzy-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Liberar disco do runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.deploy/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ inputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
          build-args: |
            NODE_ENV=production
            DEMO=false
            NX_BRANCH=b2l
            GAUZY_APP_VERSION=${{ inputs.version }}
            GAUZY_APP_COMMIT=${{ steps.meta.outputs.sha }}
